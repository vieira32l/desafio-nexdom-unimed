server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # SPA: qualquer rota que não seja um arquivo real cai no index.html
        # para o Vue Router assumir o roteamento client-side.
        try_files $uri $uri/ /index.html;
    }
}
