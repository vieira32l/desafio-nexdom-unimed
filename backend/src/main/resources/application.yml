server:
  port: 8080

spring:
  application:
    name: beneficiarios-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:desafio_db}
    username: ${DB_USER:app_user}
    password: ${DB_PASSWORD:app_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mvc:
    problemdetails:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  jwt:
    secret: ${JWT_SECRET:scaffold-only-change-this-secret-before-any-real-use}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000} # 8 horas
  cors:
    # localhost:5173 = Vite em dev; localhost:8080 = frontend containerizado (Nginx) no docker-compose.
    # O serviço "backend" do docker-compose sobrescreve isso explicitamente; este default cobre
    # quem roda a API direto com ./mvnw fora de container.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
